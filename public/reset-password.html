<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งรหัสผ่านใหม่ - HR Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #2d3748;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 520px;
            width: 100%;
            overflow: hidden;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            padding: 48px 32px 32px;
            background: white;
        }

        .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 12px;
        }

        .header p {
            color: #718096;
            font-size: 15px;
            line-height: 1.6;
        }

        .form-content {
            padding: 0 32px 48px;
        }

        .loading-state {
            text-align: center;
            padding: 40px 0;
        }

        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #718096;
            font-size: 16px;
        }

        .info-box {
            background: #e6fffa;
            border: 1px solid #81e6d9;
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #234e52;
            line-height: 1.6;
        }

        .info-box h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a202c;
        }

        .info-box ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .info-box li {
            padding: 3px 0;
            padding-left: 20px;
            position: relative;
        }

        .info-box li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #38b2ac;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2d3748;
            font-size: 14px;
        }

        .password-input-wrapper {
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            padding-right: 46px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.2s ease;
            background: white;
            color: #2d3748;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            color: #a0aec0;
            transition: color 0.2s ease;
            user-select: none;
        }

        .toggle-password:hover {
            color: #667eea;
        }

        .password-strength {
            margin-top: 8px;
        }

        .strength-bar {
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .strength-fill {
            height: 100%;
            width: 0;
            transition: width 0.3s, background-color 0.3s;
            border-radius: 2px;
        }

        .strength-weak {
            background: linear-gradient(90deg, #fc8181 0%, #f56565 100%);
            width: 33%;
        }

        .strength-medium {
            background: linear-gradient(90deg, #f6ad55 0%, #ed8936 100%);
            width: 66%;
        }

        .strength-strong {
            background: linear-gradient(90deg, #68d391 0%, #48bb78 100%);
            width: 100%;
        }

        .strength-text {
            font-size: 13px;
            font-weight: 500;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 14px 16px;
            margin-bottom: 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .message.success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
            display: block;
        }

        .message.error {
            background: #fed7d7;
            color: #c53030;
            border: 1px solid #feb2b2;
            display: block;
        }

        #resetForm {
            display: none;
        }

        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @media (max-width: 480px) {
            .container {
                margin: 10px;
                border-radius: 12px;
            }

            .header,
            .form-content {
                padding-left: 24px;
                padding-right: 24px;
            }

            .header h1 {
                font-size: 24px;
            }

            .header p {
                font-size: 14px;
            }

            .logo {
                width: 56px;
                height: 56px;
                font-size: 24px;
            }

            .btn {
                padding: 14px;
            }
        }

        .redirect-info {
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            background: #edf2f7;
            border-radius: 8px;
            font-size: 14px;
            color: #4a5568;
        }

        .redirect-info .countdown {
            font-weight: 600;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🔑</div>
            <h1>ตั้งรหัสผ่านใหม่</h1>
            <p>กรุณาตั้งรหัสผ่านใหม่ของคุณ</p>
        </div>

        <div class="form-content">
            <div id="loadingState" class="loading-state">
                <div class="spinner"></div>
                <p class="loading-text">กำลังตรวจสอบลิงค์...</p>
            </div>

            <div id="message" class="message"></div>

            <form id="resetForm">
                <div class="info-box">
                    <h4>ข้อกำหนดรหัสผ่าน:</h4>
                    <ul>
                        <li>มีความยาวอย่างน้อย 6 ตัวอักษร</li>
                        <li>ควรใช้ตัวพิมพ์ใหญ่ ตัวพิมพ์เล็ก ตัวเลข และอักขระพิเศษ</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label for="newPassword">รหัสผ่านใหม่</label>
                    <div class="password-input-wrapper">
                        <input
                            type="password"
                            id="newPassword"
                            name="newPassword"
                            placeholder="กรอกรหัสผ่านใหม่"
                            required
                            minlength="6"
                            autocomplete="new-password"
                        >
                        <span class="toggle-password" onclick="togglePassword('newPassword', this)">👁️</span>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <span class="strength-text" id="strengthText"></span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">ยืนยันรหัสผ่านใหม่</label>
                    <div class="password-input-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="กรอกรหัสผ่านอีกครั้ง"
                            required
                            minlength="6"
                            autocomplete="new-password"
                        >
                        <span class="toggle-password" onclick="togglePassword('confirmPassword', this)">👁️</span>
                    </div>
                </div>

                <button type="submit" class="btn" id="submitBtn">
                    <span id="btnText">เปลี่ยนรหัสผ่าน</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const loadingState = document.getElementById('loadingState');
        const resetForm = document.getElementById('resetForm');
        const messageDiv = document.getElementById('message');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');

        // Verify token on page load
        async function verifyToken() {
            if (!token) {
                loadingState.style.display = 'none';
                showMessage('ลิงค์ไม่ถูกต้อง กรุณาตรวจสอบอีเมลของคุณอีกครั้ง', 'error');
                return;
            }

            try {
                const response = await fetch(`/api/verify-reset-token/${token}`);
                const data = await response.json();

                loadingState.style.display = 'none';

                if (data.success) {
                    resetForm.style.display = 'block';
                } else {
                    showMessage(data.message || 'ลิงค์รีเซ็ตรหัสผ่านไม่ถูกต้องหรือหมดอายุแล้ว', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                loadingState.style.display = 'none';
                showMessage('เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง', 'error');
            }
        }

        // Password strength checker
        newPasswordInput.addEventListener('input', (e) => {
            const password = e.target.value;
            const strength = calculatePasswordStrength(password);

            strengthFill.className = 'strength-fill';

            if (password.length === 0) {
                strengthText.textContent = '';
                return;
            }

            if (strength.score === 1) {
                strengthFill.classList.add('strength-weak');
                strengthText.textContent = 'รหัสผ่านอ่อนแอ';
                strengthText.style.color = '#f56565';
            } else if (strength.score === 2) {
                strengthFill.classList.add('strength-medium');
                strengthText.textContent = 'รหัสผ่านปานกลาง';
                strengthText.style.color = '#ed8936';
            } else if (strength.score >= 3) {
                strengthFill.classList.add('strength-strong');
                strengthText.textContent = 'รหัสผ่านแข็งแรง';
                strengthText.style.color = '#48bb78';
            }
        });

        function calculatePasswordStrength(password) {
            let score = 0;
            if (password.length >= 6) score++;
            if (password.length >= 10) score++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
            if (/\d/.test(password)) score++;
            if (/[^a-zA-Z\d]/.test(password)) score++;

            return { score: Math.min(score, 3) };
        }

        function togglePassword(fieldId, icon) {
            const field = document.getElementById(fieldId);
            if (field.type === 'password') {
                field.type = 'text';
                icon.textContent = '🙈';
            } else {
                field.type = 'password';
                icon.textContent = '👁️';
            }
        }

        // Handle form submission
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (newPassword !== confirmPassword) {
                showMessage('รหัสผ่านไม่ตรงกัน กรุณาตรวจสอบอีกครั้ง', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showMessage('รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษร', 'error');
                return;
            }

            // Disable form
            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="loading-spinner"></span><span>กำลังเปลี่ยนรหัสผ่าน...</span>';

            try {
                const response = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        newPassword: newPassword
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message, 'success');
                    resetForm.reset();

                    // Show redirect message with countdown
                    const redirectDiv = document.createElement('div');
                    redirectDiv.className = 'redirect-info';
                    redirectDiv.innerHTML = 'กำลังพาคุณไปหน้าเข้าสู่ระบบใน <span class="countdown">3</span> วินาที...';
                    messageDiv.parentNode.insertBefore(redirectDiv, messageDiv.nextSibling);

                    let countdown = 3;
                    const countdownInterval = setInterval(() => {
                        countdown--;
                        const countdownSpan = redirectDiv.querySelector('.countdown');
                        if (countdownSpan) {
                            countdownSpan.textContent = countdown;
                        }
                        if (countdown === 0) {
                            clearInterval(countdownInterval);
                        }
                    }, 1000);

                    // Redirect to login page after 3 seconds
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 3000);
                } else {
                    showMessage(data.message || 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง', 'error');
                    submitBtn.disabled = false;
                    btnText.textContent = 'เปลี่ยนรหัสผ่าน';
                }
            } catch (error) {
                console.error('Error:', error);
                showMessage('เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง', 'error');
                submitBtn.disabled = false;
                btnText.textContent = 'เปลี่ยนรหัสผ่าน';
            }
        });

        function showMessage(message, type) {
            messageDiv.textContent = message;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }

        // Verify token when page loads
        verifyToken();
    </script>
</body>
</html>
